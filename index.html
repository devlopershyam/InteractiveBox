<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="box-center-text">YAY! It’s BOGO</div>
    <!--1-BOX-->
    <div class="color-box">
      <div class="box-header">
        <div class="box-title">
          <input type="radio" class="radio-unit">
          1 Unit <span class="discount-badge">10% Off</span>
        </br>
          <small class="standard-badge">Standard Price</small>
        </div>
        
        <div class="price-container">
          <div class="discount-price">$10.00 USD</div>
          <div class="original-price">$24.00 USD</div>
        </div>
      </div>

      <!--size and color options-->
      <div class="option-container">
        <div class="dropdown">
          <div class="option-group">
            <label class="option-title">Size</label>
            <div class="drop-row">
              <label class="number"># 1</label>
              <select class="size-dropdown"></select>
            </div>
            <div class="drop-row">
              <label class="number"># 2</label>
              <select class="size-dropdown"></select>
            </div>
          </div>

          <div class="option-group">
            <label class="option-title">Color</label>
            <div class="drop-row">
              <select class="color-dropdown"></select>
            </div>
            <div class="drop-row">
              <select class="color-dropdown"></select>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!--2-BOX-->

    <div class="color-box">
      <div class="box-header">
        <div class="popular-badge">MOST POPULAR</div>
        <div class="box-title">
          <input type="radio" class="radio-unit">
          2 Unit <span class="discount-badge">20% Off</span>
        </div>
        <div class="price-container">
          <div class="discount-price">$18.00 USD</div>
          <div class="original-price">$24.00 USD</div>
        </div>
      </div>

      <!--size and color options-->
      <div class="option-container">
        <div class="dropdown">
          <div class="option-group">
            <label class="option-title">Size</label>
            <div class="drop-row">
              <label class="number"># 1</label>
              <select class="size-dropdown"></select>
            </div>
            <div class="drop-row">
              <label class="number"># 2</label>
              <select class="size-dropdown"></select>
            </div>
          </div>
          <div class="option-group">
            <label class="option-title">color</label>
            <div class="drop-row">
              <select class="color-dropdown"></select>
            </div>
            <div class="drop-row">
              <select class="color-dropdown"></select>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!--3-BOX-->
    <div class="color-box">
      <div class="box-header">
        <div class="box-title">
          <input type="radio" class="radio-unit">
          3 Unit <span class="discount-badge">30% Off</span>
        </div>
        <div class="price-container">
          <div class="discount-price">$24.00 USD</div>
          <div class="original-price">$24.00 USD</div>
        </div>
      </div>

      <!--size and color options-->
      <div class="option-container">
        <div class="dropdown">
          <div class="option-group">
            <label class="option-title">Size</label>
            <div class="drop-row">
              <label class="number"># 1</label>
              <select class="size-dropdown"></select>
            </div>
            <div class="drop-row">
              <label class="number"># 2</label>
              <select class="size-dropdown"></select>
            </div>
          </div>
          <div class="option-group">
            <label class="option-title">color</label>
            <div class="drop-row">
              <select class="color-dropdown"></select>
            </div>
            <div class="drop-row">
              <select class="color-dropdown"></select>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="footer">
      <div class="free-delivery">Free Delivery</div>
      <div class="total">Total: <span id="totalPrice">$0.00 USD</span></div>
    </div>
    <div class="addButton">
      <button class="addButton">+ Add to Cart</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
